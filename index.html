<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的个人空间</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "微软雅黑", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
  }
  #login {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100vh; gap: 14px;
  }
  #login h1 { font-size: 22px; margin: 0 0 10px; }
  #login input {
    width: 240px; padding: 12px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 15px;
  }
  #login button {
    width: 240px; padding: 12px; border: none; border-radius: 8px;
    background: #0071e3; color: #fff; font-size: 15px; cursor: pointer;
  }
  #login button:hover { background: #0060c0; }
  #err { color: #e00; font-size: 13px; height: 16px; }

  #app { display: none; max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; margin: 0; }
  .logout {
    font-size: 13px; color: #0071e3; cursor: pointer;
    background: none; border: none; padding: 0;
  }

  .composer {
    background: #fff; border-radius: 12px; padding: 12px;
    margin-bottom: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .composer textarea {
    width: 100%; border: 1px solid #e0e0e0; border-radius: 8px;
    padding: 10px; font-size: 15px; font-family: inherit;
    resize: vertical; min-height: 70px; outline: none;
  }
  .composer textarea:focus { border-color: #0071e3; }
  .composer .row {
    display: flex; justify-content: flex-end; margin-top: 8px;
  }
  .composer button {
    padding: 8px 18px; border: none; border-radius: 8px;
    background: #0071e3; color: #fff; font-size: 14px; cursor: pointer;
  }
  .composer button:hover { background: #0060c0; }

  .post {
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    position: relative;
  }
  .post time { font-size: 12px; color: #86868b; }
  .post p { margin: 8px 0 0; line-height: 1.6; white-space: pre-wrap; }
  .empty { text-align: center; color: #86868b; font-size: 14px; padding: 30px 0; }

  .lock {
    text-align: center; padding: 30px 16px;
    color: #86868b; font-size: 14px;
  }
  .lock .hint { margin-bottom: 14px; color: #1d1d1f; }
  .lock input {
    width: 180px; padding: 10px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 15px; text-align: center;
    letter-spacing: 2px; outline: none;
  }
  .lock input:focus { border-color: #0071e3; }
  .lock button {
    margin-left: 8px; padding: 10px 18px; border: none;
    border-radius: 8px; background: #0071e3; color: #fff;
    font-size: 14px; cursor: pointer;
  }
  .lock button:hover { background: #0060c0; }
  .lock .tip { color: #e00; font-size: 13px; height: 18px; margin-top: 8px; }
</style>
</head>

  <button onclick="doLogin()">进入</button>

    <button class="logout" onclick="doLogout()">退出</button>
  </div>

  <div class="composer">
    <textarea id="newPost" placeholder="说点什么…"></textarea>
    <div class="row">
      <button onclick="publish()">发布</button>
    </div>
  </div>

  <div id="feed"></div>

let posts = [...DEFAULT_POSTS];

/* ========== 登录 ========== */
function doLogin() {
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value;
  if (u === ACCOUNT.user && p === ACCOUNT.pass) {
    showApp();
  } else {
    document.getElementById('err').textContent = '账号（仅英文）或密码错误';
  }
}

function doLogout() {
  location.reload();
}

/* ========== 渲染（两把锁） ========== */
function render() {
  const feed = document.getElementById('feed');
  if (posts.length === 0) {
    feed.innerHTML = '<div class="empty">还没有动态，发一条吧～</div>';
    return;
  }

  feed.innerHTML = posts.map(function(p, i) {
    /* 第一把锁：索引 8 ~ 11 */
    if (!unlocked && i >= LOCK_FROM_INDEX && i < LOCK2_FROM_INDEX) {
      if (i === LOCK_FROM_INDEX) {
        return '<div class="post">' +
           '<time>' + p.date + '</time>' +
           '<div class="lock">' +
             '<div class="hint">🔒 后面的动态已加锁</div>' +
             '<div class="hint">密码提示：我的爱好之和（三位数）</div>' +
             '<input id="lockInput" type="password" placeholder="输入密码" ' +
                    'onkeydown="if(event.key===\'Enter\')tryUnlock()">' +
             '<button onclick="tryUnlock()">解锁</button>' +
             '<div class="tip" id="lockTip"></div>' +
           '</div>' +
         '</div>';
      }
      return '';
    }

    /* 第二把锁：索引 >= 12 */
    if (!unlocked2 && i >= LOCK2_FROM_INDEX) {
      if (i === LOCK2_FROM_INDEX) {
        return '<div class="post">' +
           '<time>' + p.date + '</time>' +
           '<div class="lock">' +
             '<div class="hint">🔒 后面的动态已加锁</div>' +
             '<div class="hint">密码提示：我的信念（四位数）</div>' +
             '<input id="lockInput2" type="password" placeholder="输入密码" ' +
                    'onkeydown="if(event.key===\'Enter\')tryUnlock2()">' +
             '<button onclick="tryUnlock2()">解锁</button>' +
             '<div class="tip" id="lockTip2"></div>' +
           '</div>' +
         '</div>';
      }
      return '';
    }

    /* 正常显示 */
    return '<div class="post">' +
       '<time>' + p.date + '</time>' +
       '<p>' + escapeHtml(p.text) + '</p>' +
     '</div>';
  }).join('');
}

/* ========== 解锁第一把 ========== */
function tryUnlock() {
  const box = document.getElementById('lockInput');
  const tip = document.getElementById('lockTip');
  if (box.value.trim() === LOCK_PASSWORD) {
    unlocked = true;
    render();
  } else {
    tip.textContent = '密码不对，再想想';
  }
}

/* ========== 解锁第二把 ========== */
function tryUnlock2() {
  const box = document.getElementById('lockInput2');
  const tip = document.getElementById('lockTip2');
  if (box.value.trim() === LOCK2_PASSWORD) {
    unlocked2 = true;
    render();
  } else {
    tip.textContent = '密码不对，再想想';
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

/* ========== 发布 ========== */
function publish() {
  const box = document.getElementById('newPost');
  const text = box.value.trim();
  if (!text) return;
  const now = new Date();
  const date = now.getFullYear() + '-' +
    String(now.getMonth() + 1).padStart(2, '0') + '-' +
    String(now.getDate()).padStart(2, '0') + ' ' +
    String(now.getHours()).padStart(2, '0') + ':' +
    String(now.getMinutes()).padStart(2, '0');
  posts.push({ date: date, text: text });
  box.value = '';
  render();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

/* ========== 显示内容页 ========== */
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
}

/* 回车登录 */
document.getElementById('pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

/* Ctrl/Cmd + Enter 快速发布 */
document.getElementById('newPost').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') publish();
});
</script>
